version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL 16 Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hyperx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hyperx_db}
      POSTGRES_USER: ${DB_USER:-hyperx_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hyperx_secure_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V1__init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hyperx_user} -d ${DB_NAME:-hyperx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hyperx-network

  # ===========================================================================
  # HyperX Backend (Spring Boot 3.3 / Java 21)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-hyperx_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-hyperx_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-hyperx_secure_pass_2026}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hyperx-network

  # ===========================================================================
  # HyperX Frontend (React + Vite + TypeScript + Tailwind)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - hyperx-network

volumes:
  postgres_data:
    driver: local

networks:
  hyperx-network:
    driver: bridge
