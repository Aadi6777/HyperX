version: '3.8'

services:
  # ===========================================================================
  # MongoDB 7 Database
  # ===========================================================================
  mongo:
    image: mongo:7-jammy
    container_name: hyperx-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hyperx
    volumes:
      - mongo_data:/data/db
    networks:
      - hyperx-network

  # ===========================================================================
  # HyperX Backend (Node.js 20 / Express / Mongoose / WebSockets)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyperx-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/hyperx
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-hyperx-mern-secret-key-32-chars-minimum-2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hyperx-network

  # ===========================================================================
  # HyperX Frontend (React + Vite + TypeScript + Nginx)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyperx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    networks:
      - hyperx-network

volumes:
  mongo_data:
    driver: local

networks:
  hyperx-network:
    driver: bridge
