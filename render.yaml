services:
  - type: web
    name: hyperx-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

